[project]
name = "memory-garden"
version = "2.0.0"
description = "Memory Garden — 面向个人长期记录的认知回溯 Agent（只读证据协议 + 混合检索 + MCP 工具）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "drephantom" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "jieba>=0.42",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.2",
]

[project.scripts]
memory-garden = "memory_garden.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_garden"]

[tool.hatch.build]
# 私有的本地回答评测实验由 .git/info/exclude 管理；打包器不会读取该排除文件。
exclude = ["src/memory_garden/rag_evaluation.py"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM108", "E501"]  # 中文注释/提示语常超 100 列，豁免行宽

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
