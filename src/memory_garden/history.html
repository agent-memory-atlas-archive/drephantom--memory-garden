<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>历史 · Memory Garden</title><link rel="icon" type="image/svg+xml" href="/static/favicon.svg"><link rel="stylesheet" href="/static/garden.css"><script src="/static/workspace.js" defer></script><script src="/static/history.js" defer></script></head><body><header class="site-header"><a class="brand" href="/"><img class="brand-mark" src="/static/brand-mark.svg" width="40" height="40" alt="" aria-hidden="true"><span><strong>Memory Garden</strong><small>过去的回看，仍留在这里</small></span></a><nav aria-label="主导航"><a href="/">新的回看</a><a href="/history" class="active">历史</a><a href="/import">导入</a><a href="/settings">设置</a></nav></header><main class="main"><div class="workspace"><div class="vault-bar" aria-label="当前笔记库"><div><strong data-workspace-name>正在读取笔记库</strong><span data-workspace-status role="status"></span><a data-workspace-home href="/?view=map&amp;scope=global" hidden>回到当前笔记库</a></div><button type="button" data-connect-vault>连接笔记库</button></div><h1 class="page-heading">走过的对话</h1><p class="quiet">按最近活动排列。什么时候想继续，都可以回来。</p><form id="history-search" class="history-search"><label class="sr-only" for="history-query">搜索历史对话</label><input id="history-query" type="search" maxlength="120" placeholder="搜索主题或对话中的一句话"><button type="submit">搜索</button></form><a class="history-new" href="/">＋ 开始新的回看</a><div id="history-list" aria-live="polite"><p class="quiet">正在读取历史…</p></div><div class="history-pagination"><button id="history-more" type="button" hidden>查看更早的对话</button><span id="history-status" class="quiet" role="status"></span></div></div></main></body></html>
