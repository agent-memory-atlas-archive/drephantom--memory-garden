<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{NAME}} · Memory Garden</title><link rel="stylesheet" href="/static/garden.css"><script src="/static/garden.js" defer></script></head>
<body><header class="site-header"><a class="brand" href="/" aria-label="Memory Garden 首页"><span class="brand-mark" aria-hidden="true">✳</span><span><strong class="brand-name">{{NAME}}</strong><small>MEMORY GARDEN</small></span></a><nav aria-label="主导航"><a href="/" class="active">新的回看</a><a href="/history">历史</a><a href="/settings">设置</a></nav></header>
<main id="main" class="main"><div class="workspace">
<div class="context-bar"><span id="mode" class="mode">正在连接本地花园</span><span>原始笔记只读</span></div>
<section id="welcome" class="welcome"><p class="eyebrow">属于你的，慢慢生长的记忆</p><h1>回看走过的路，<br>听听现在的自己。</h1><p class="intro">把当时写下的话放在一起，看看什么变了，什么仍然重要。<br class="desktop-break">不急着解释，也不用现在就有答案。</p>
<div class="start-options"><button class="primary" id="discover">找一条回看线索 <span aria-hidden="true">↗</span></button><span class="quiet">没有想好问题，也可以从这里开始</span></div>
<div class="seeds" aria-label="试着从一个主题开始"><span>或者，回看一个主题</span><button data-question="关于「自主判断」，我的想法以前到现在有没有变化？">自主判断</button><button data-question="关于「写作」，我的想法变过吗？">写作</button><button data-question="关于「独处」，我的想法变过吗？">独处</button></div>
<p class="library-note" id="library"></p><div id="discoveries" class="discoveries" aria-live="polite"></div></section>
<div id="notice" class="notice" role="status" hidden></div><section id="chat" class="chat" aria-label="回看对话" aria-busy="false"></section>
</div></main>
<footer class="composer-area"><form id="composer" class="composer"><label class="sr-only" for="q">想回看的问题或想法</label><textarea id="q" rows="1" maxlength="6000" placeholder="想起了什么？从一句话开始就好。"></textarea><button id="send" class="primary" type="submit">发送 <span aria-hidden="true">↑</span></button></form><p class="composer-hint">Enter 发送 · Shift + Enter 换行 <span>你可以不同意，也可以暂时不判断。</span></p></footer>
<dialog id="source-dialog" class="source-dialog" aria-labelledby="source-title"><div class="dialog-top"><span class="eyebrow">回答时引用的记录片段</span><button id="close-source" class="icon-button" aria-label="关闭原始记录">×</button></div><h2 id="source-title"></h2><p id="source-dates" class="quiet"></p><blockquote id="source-text"></blockquote><p id="source-path" class="source-path"></p><p class="quiet">这里保留引用时的片段，后续改动笔记不会覆盖这次回看的证据。</p></dialog>
</body></html>
